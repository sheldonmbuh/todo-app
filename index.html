<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker - Sheldon Mbuh</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f4f6fb; margin: 0; color: #1c2430; }
  main { width: min(calc(100% - 2rem), 608px); margin: clamp(1rem, 5vw, 2.5rem) auto; background: #fff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 8px 24px rgba(15,30,58,0.12); }
  h1 { margin-top: 0; color: #0f1e3a; }
  form { display: flex; gap: 0.5rem; }
  input[type="text"] { flex: 1; min-width: 0; padding: 0.65rem; border: 1px solid #b9c4d4; border-radius: 6px; }
  button { background: #214b93; color: #fff; border: 0; border-radius: 6px; padding: 0.65rem 1rem; cursor: pointer; }
  .filters { margin: 1rem 0; display: flex; gap: 0.4rem; }
  .filters button { background: #eef2f7; color: #1c2430; }
  .filters button.active { background: #214b93; color: #fff; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0; border-bottom: 1px solid #e6ebf2; }
  li span { flex: 1; overflow-wrap: anywhere; }
  li.done span { text-decoration: line-through; color: #7a8798; }
  .del { background: none; color: #b3261e; padding: 0.2rem 0.4rem; }
  #count { color: #5b6b82; font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Task Tracker</h1>
  <form id="addForm">
    <input type="text" id="taskInput" placeholder="Add a task and press Enter" aria-label="New task" required>
    <button type="submit">Add</button>
  </form>
  <div class="filters">
    <button data-filter="all" class="active" aria-pressed="true">All</button>
    <button data-filter="open" aria-pressed="false">Open</button>
    <button data-filter="done" aria-pressed="false">Done</button>
  </div>
  <ul id="list"></ul>
  <p id="count" role="status"></p>
  <p id="storage-status" role="status" hidden></p>
</main>
<script>
  const KEY = "task-tracker-items";
  const storageStatus = document.getElementById("storage-status");
  let tasks = [];
  let protectStoredTasks = false;

  function reportStorageIssue(message) {
    storageStatus.textContent = message;
    storageStatus.hidden = false;
  }

  try {
    const stored = JSON.parse(localStorage.getItem(KEY) || "[]");
    if (!Array.isArray(stored) || !stored.every(task =>
      task && typeof task.text === "string" && typeof task.done === "boolean"
    )) throw new Error("Invalid stored task list");
    tasks = stored;
  } catch {
    protectStoredTasks = true;
    reportStorageIssue("Saved tasks could not be loaded. Changes will last until you reload.");
  }
  let filter = "all";
  const list = document.getElementById("list");
  const count = document.getElementById("count");
  function save() {
    if (protectStoredTasks) return;
    try {
      localStorage.setItem(KEY, JSON.stringify(tasks));
      storageStatus.hidden = true;
    } catch {
      reportStorageIssue("Changes could not be saved to this browser.");
    }
  }
  function render() {
    list.replaceChildren();
    tasks.filter(function (t) { return filter === "all" || (filter === "done") === t.done; })
      .forEach(function (t) {
        const li = document.createElement("li");
        if (t.done) li.className = "done";
        const box = document.createElement("input");
        box.type = "checkbox"; box.checked = t.done;
        box.setAttribute("aria-label", t.text);
        box.addEventListener("change", function () { t.done = box.checked; save(); render(); });
        const span = document.createElement("span"); span.textContent = t.text;
        const del = document.createElement("button"); del.textContent = "Delete"; del.className = "del";
        del.setAttribute("aria-label", "Delete " + t.text);
        del.addEventListener("click", function () { tasks = tasks.filter(x => x !== t); save(); render(); });
        li.append(box, span, del); list.appendChild(li);
      });
    const open = tasks.filter(function (t) { return !t.done; }).length;
    count.textContent = tasks.length === 0 ? "No tasks yet." : open + " open, " + (tasks.length - open) + " done, " + tasks.length + " total.";
  }
  document.getElementById("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const input = document.getElementById("taskInput");
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ id: Date.now(), text: text, done: false });
    input.value = ""; save(); render();
  });
  document.querySelectorAll(".filters button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.getAttribute("data-filter");
      document.querySelectorAll(".filters button").forEach(function (b) {
        b.classList.toggle("active", b === btn);
        b.setAttribute("aria-pressed", String(b === btn));
      });
      render();
    });
  });
  render();
</script>
</body>
</html>
